<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vanish — Auto Pointer Hider</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="logo-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM12 20C7.59 20 4 16.41 4 12C4 7.59 7.59 4 12 4C16.41 4 20 7.59 20 12C20 16.41 16.41 20 12 20Z" fill="currentColor"/>
            <path d="M12 6C8.69 6 6 8.69 6 12C6 15.31 8.69 18 12 18C15.31 18 18 15.31 18 12C18 8.69 15.31 6 12 6ZM12 16C9.79 16 8 14.21 8 12C8 9.79 9.79 8 12 8C14.21 8 16 9.79 16 12C16 14.21 14.21 16 12 16Z" fill="currentColor"/>
          </svg>
        </div>
        <div class="brand-title">
          <h1>Vanish</h1>
          <span class="version">v1.0</span>
        </div>
      </div>
      <label class="toggle-switch" title="Global Toggle">
        <input type="checkbox" id="global-toggle">
        <span class="slider"></span>
      </label>
    </header>

    <!-- Site Status Banner -->
    <div class="status-card" id="status-card">
      <div class="status-indicator" id="status-indicator"></div>
      <div class="status-info">
        <div class="status-text" id="status-text">Checking domain...</div>
        <div class="status-domain" id="status-domain">example.com</div>
      </div>
      <button class="site-toggle-btn" id="site-toggle-btn" title="Toggle for this site">
        Enable
      </button>
    </div>

    <!-- Main Controls -->
    <div class="controls-section">
      <!-- Fullscreen Mode Toggle -->
      <div class="control-row">
        <div class="control-label">
          <span class="label-title">Fullscreen Only</span>
          <span class="label-desc">Only hide cursor when player is fullscreen</span>
        </div>
        <label class="toggle-switch">
          <input type="checkbox" id="fullscreen-only-toggle">
          <span class="slider"></span>
        </label>
      </div>

      <!-- All Sites Force Mode Toggle -->
      <div class="control-row">
        <div class="control-label">
          <span class="label-title">Enable on All Websites</span>
          <span class="label-desc">Force cursor hiding on any video site</span>
        </div>
        <label class="toggle-switch">
          <input type="checkbox" id="all-sites-toggle">
          <span class="slider"></span>
        </label>
      </div>

      <!-- Idle Delay Slider -->
      <div class="control-row delay-control">
        <div class="control-label-header">
          <span class="label-title">Idle Delay</span>
          <span class="delay-val" id="delay-val">2.0s</span>
        </div>
        <div class="slider-wrapper">
          <input type="range" id="delay-slider" min="0.5" max="10" step="0.5" value="2.0">
        </div>
      </div>
    </div>

    <!-- Quick Sites List -->
    <div class="presets-quick">
      <div class="section-title">Popular Streaming Sites</div>
      <div class="presets-pills" id="presets-pills">
        <!-- Site pills dynamically inserted here -->
      </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <button id="open-options-btn" class="options-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
        <span>Open Advanced Options</span>
      </button>
    </footer>
  </div>

  <script src="../dist/popup/popup.js"></script>
</body>
</html>
