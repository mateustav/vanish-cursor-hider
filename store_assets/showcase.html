<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vanish Showcase</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1280px;
      height: 800px;
      background: #0b0f19;
      color: #f9fafb;
      font-family: 'Plus Jakarta Sans', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .poster-container {
      width: 1280px;
      height: 800px;
      padding: 60px 80px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .left-hero {
      max-width: 540px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .hero-brand {
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .logo-hero {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }
    .logo-hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .hero-title h1 {
      font-size: 36px;
      font-weight: 800;
      line-height: 1.1;
    }
    .hero-title span {
      font-size: 14px;
      color: #38bdf8;
      font-weight: 600;
    }
    .hero-desc {
      font-size: 18px;
      color: #9ca3af;
      line-height: 1.6;
    }
    .badge-pills {
      display: flex;
      gap: 12px;
    }
    .pill {
      background: #1f2937;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #38bdf8;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
    }
    .right-preview {
      width: 380px;
      height: 560px;
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: #0f172a;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div class="poster-container">
    <div class="left-hero">
      <div class="hero-brand">
        <div class="logo-hero">
          <img src="../icons/icon512.png" alt="Vanish">
        </div>
        <div class="hero-title">
          <h1>Vanish</h1>
          <span>Auto Pointer Hider for Video Playback</span>
        </div>
      </div>
      <p class="hero-desc">
        Automatically vanishes your mouse pointer while watching videos on Disney+, YouTube, and custom streaming sites. 
      </p>
      <div class="badge-pills">
        <div class="pill">🎬 Disney+ Native</div>
        <div class="pill">📺 YouTube Supported</div>
        <div class="pill">⚡ 0% CPU Overhead</div>
      </div>
    </div>
    <div class="right-preview">
      <iframe src="../popup/popup.html"></iframe>
    </div>
  </div>
</body>
</html>
