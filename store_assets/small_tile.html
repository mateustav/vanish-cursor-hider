<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Small Promo Tile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 440px;
      height: 280px;
      background: #0b0f19;
      color: #f9fafb;
      font-family: 'Plus Jakarta Sans', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 24px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .logo-box {
      width: 90px;
      height: 90px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .logo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .title-box {
      text-align: center;
    }
    h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #f9fafb;
      line-height: 1.1;
    }
    p {
      font-size: 13px;
      color: #38bdf8;
      font-weight: 700;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="logo-box">
    <img src="../icons/icon512.png" alt="Vanish">
  </div>
  <div class="title-box">
    <h1>Vanish</h1>
    <p>Auto Pointer Hider for Video</p>
  </div>
</body>
</html>
