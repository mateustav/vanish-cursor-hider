<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vanish Showcase (1280x800)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1280px;
      height: 800px;
      background: #141715;
      color: #e6ece8;
      font-family: 'Plus Jakarta Sans', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    body::before {
      content: '';
      position: absolute;
      width: 800px;
      height: 800px;
      background: radial-gradient(circle, rgba(125, 168, 141, 0.15) 0%, rgba(20, 23, 21, 0) 70%);
      top: 50%;
      left: 35%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .poster-container {
      width: 1280px;
      height: 800px;
      padding: 60px 80px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 1;
    }
    .left-hero {
      max-width: 540px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .hero-brand {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .logo-hero {
      width: 84px;
      height: 84px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(125, 168, 141, 0.3);
    }
    .logo-hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .hero-title h1 {
      font-size: 40px;
      font-weight: 800;
      line-height: 1.1;
      color: #e6ece8;
    }
    .hero-title span {
      font-size: 16px;
      color: #7da88d;
      font-weight: 700;
    }
    .hero-desc {
      font-size: 18px;
      color: #a3b2a8;
      line-height: 1.6;
    }
    .badge-pills {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .pill {
      background: #1e2420;
      border: 1px solid rgba(125, 168, 141, 0.35);
      color: #7da88d;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 700;
    }
    .right-preview {
      width: 440px;
      height: 580px;
      border-radius: 22px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(125, 168, 141, 0.25);
      background: #141715;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    iframe {
      border: 1px solid rgba(125, 168, 141, 0.25);
      border-radius: 12px;
      background: #141715;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>
  <div class="poster-container">
    <div class="left-hero">
      <div class="hero-brand">
        <div class="logo-hero">
          <img src="vanish_brand_logo_square.png" alt="Vanish">
        </div>
        <div class="hero-title">
          <h1>Vanish</h1>
          <span>Auto Pointer Hider for Video Playback</span>
        </div>
      </div>
      <p class="hero-desc">
        Automatically vanishes your mouse pointer while watching videos on Disney+, YouTube, and custom streaming sites. 
      </p>
      <div class="badge-pills">
        <div class="pill">🎬 Disney+ Native</div>
        <div class="pill">📺 YouTube Supported</div>
        <div class="pill">⚡ 0% CPU Overhead</div>
      </div>
    </div>
    <div class="right-preview">
      <iframe src="../popup/popup_mock.html" width="340" height="490" scrolling="no"></iframe>
    </div>
  </div>
</body>
</html>
