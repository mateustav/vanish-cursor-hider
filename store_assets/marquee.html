<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Marquee Promo Tile (1400x560)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1400px;
      height: 560px;
      background: #141715;
      color: #e6ece8;
      font-family: 'Plus Jakarta Sans', sans-serif;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 60px 90px;
      overflow: hidden;
      position: relative;
    }
    body::before {
      content: '';
      position: absolute;
      width: 700px;
      height: 700px;
      background: radial-gradient(circle, rgba(125, 168, 141, 0.12) 0%, rgba(20, 23, 21, 0) 70%);
      top: 50%;
      left: 30%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .brand-content {
      max-width: 660px;
      display: flex;
      flex-direction: column;
      gap: 26px;
      z-index: 1;
    }
    .header-group {
      display: flex;
      align-items: center;
      gap: 24px;
    }
    .logo-frame {
      width: 110px;
      height: 110px;
      border-radius: 26px;
      overflow: hidden;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(125, 168, 141, 0.25);
      flex-shrink: 0;
    }
    .logo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .title-group h1 {
      font-size: 54px;
      font-weight: 800;
      letter-spacing: -1.5px;
      line-height: 1.05;
      color: #e6ece8;
    }
    .title-group p {
      font-size: 22px;
      font-weight: 700;
      color: #7da88d;
      margin-top: 6px;
    }
    .tagline {
      font-size: 19px;
      color: #a3b2a8;
      line-height: 1.6;
    }
    .feature-pills {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }
    .pill {
      background: #1e2420;
      border: 1px solid rgba(125, 168, 141, 0.3);
      color: #e6ece8;
      padding: 10px 20px;
      border-radius: 24px;
      font-size: 15px;
      font-weight: 700;
    }
    .hero-art {
      width: 480px;
      height: 440px;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(125, 168, 141, 0.2);
      z-index: 1;
      background: #1e2420;
    }
    .hero-art img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <div class="brand-content">
    <div class="header-group">
      <div class="logo-frame">
        <img src="vanish_brand_logo_square.png" alt="Vanish">
      </div>
      <div class="title-group">
        <h1>Vanish</h1>
        <p>Auto Pointer Hider for Video Playback</p>
      </div>
    </div>
    <p class="tagline">
      Automatically vanishes your mouse pointer during video playback on Disney+, YouTube, and custom streaming platforms.
    </p>
    <div class="feature-pills">
      <div class="pill">🎬 Disney+ & YouTube Native</div>
      <div class="pill">⏱️ Customizable Idle Timer</div>
      <div class="pill">⚡ 0% CPU Overhead</div>
    </div>
  </div>
  <div class="hero-art">
    <img src="vanish_brand_logo.png" alt="Vanish Artwork">
  </div>
</body>
</html>
