<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Marquee Promo Tile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1400px;
      height: 560px;
      background: #0b0f19;
      color: #f9fafb;
      font-family: 'Plus Jakarta Sans', sans-serif;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 60px 100px;
      overflow: hidden;
    }
    .brand-content {
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }
    .header-group {
      display: flex;
      align-items: center;
      gap: 24px;
    }
    .logo-frame {
      width: 110px;
      height: 110px;
      border-radius: 26px;
      overflow: hidden;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.12);
      flex-shrink: 0;
    }
    .logo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .title-group h1 {
      font-size: 54px;
      font-weight: 800;
      letter-spacing: -1.5px;
      line-height: 1.05;
      color: #f9fafb;
    }
    .title-group p {
      font-size: 22px;
      font-weight: 700;
      color: #38bdf8;
      margin-top: 6px;
    }
    .tagline {
      font-size: 20px;
      color: #9ca3af;
      line-height: 1.6;
    }
    .feature-pills {
      display: flex;
      gap: 16px;
    }
    .pill {
      background: #111827;
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #f9fafb;
      padding: 10px 20px;
      border-radius: 24px;
      font-size: 15px;
      font-weight: 700;
    }
    .hero-art {
      width: 440px;
      height: 440px;
      border-radius: 30px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .hero-art img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <div class="brand-content">
    <div class="header-group">
      <div class="logo-frame">
        <img src="../icons/icon512.png" alt="Vanish">
      </div>
      <div class="title-group">
        <h1>Vanish</h1>
        <p>Auto Pointer Hider for Video Playback</p>
      </div>
    </div>
    <p class="tagline">
      Automatically vanishes your mouse pointer during video playback on Disney+, YouTube, and custom streaming platforms.
    </p>
    <div class="feature-pills">
      <div class="pill">🎬 Disney+ & YouTube Native</div>
      <div class="pill">⏱️ Customizable Idle Timer</div>
      <div class="pill">⚡ 0% CPU Overhead</div>
    </div>
  </div>
  <div class="hero-art">
    <img src="../icons/icon512.png" alt="Vanish Artwork">
  </div>
</body>
</html>
